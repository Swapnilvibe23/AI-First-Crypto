<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary meta -->
    <title>AIFirstCrypto — Your Daily Crypto Snapshot</title>
    <meta name="description" content="Live crypto prices, Fear & Greed index, top movers, and the latest news — all in one beginner-friendly dashboard. No login, no noise." />
    <meta name="keywords" content="crypto prices, cryptocurrency, bitcoin price, ethereum price, fear and greed index, crypto news, top crypto movers, DCA calculator, crypto for beginners, live crypto dashboard" />
    <meta name="author" content="AIFirstCrypto" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#2563EB" />

    <!-- Canonical -->
    <link rel="canonical" href="https://aifirstcrypto.com/" />

    <!-- Open Graph (Facebook, Instagram, WhatsApp, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AIFirstCrypto" />
    <meta property="og:url" content="https://aifirstcrypto.com/" />
    <meta property="og:title" content="AIFirstCrypto — Your Daily Crypto Snapshot" />
    <meta property="og:description" content="Live crypto prices, Fear & Greed index, top movers, and the latest news — all in one beginner-friendly dashboard. No login, no noise." />
    <meta property="og:image" content="https://aifirstcrypto.com/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AIFirstCrypto dashboard showing live crypto prices and market sentiment" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AIFirstCrypto" />
    <meta name="twitter:creator" content="@AIFirstCrypto" />
    <meta name="twitter:title" content="AIFirstCrypto — Your Daily Crypto Snapshot" />
    <meta name="twitter:description" content="Live crypto prices, Fear & Greed index, top movers, and the latest news — all in one beginner-friendly dashboard." />
    <meta name="twitter:image" content="https://aifirstcrypto.com/opengraph.jpg" />
    <meta name="twitter:image:alt" content="AIFirstCrypto live crypto dashboard" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AIFirstCrypto" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="AIFirstCrypto" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="shortcut icon" href="/favicon.svg" />

    <!-- Structured data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AIFirstCrypto",
      "url": "https://aifirstcrypto.com",
      "description": "Live crypto prices, Fear & Greed index, top movers, and the latest news — all in one beginner-friendly dashboard.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://aifirstcrypto.com/rates?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AIFirstCrypto",
      "url": "https://aifirstcrypto.com",
      "logo": "https://aifirstcrypto.com/icons/icon-512.png",
      "description": "Your daily AI-first crypto snapshot. Live prices, market sentiment, and clear signals — no noise.",
      "sameAs": [
        "https://twitter.com/AIFirstCrypto"
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
