name: build

on:
  pull_request:
    branches:
      - main
      - "development-(integration)"
      - "staging-(pre-production)"
      - "Production-(Live-branch)"
  push:
    branches:
      - main
      - "development-(integration)"
      - "staging-(pre-production)"
      - "Production-(Live-branch)"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No .nvmrc or engines.node in this repo; default to Node 22.
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck libraries
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s['typecheck:libs']?0:1)"; then
            pnpm run typecheck:libs
          else
            echo "typecheck:libs script not present; skipping"
          fi

      - name: Build
        run: |
          unset PORT BASE_PATH
          pnpm build
